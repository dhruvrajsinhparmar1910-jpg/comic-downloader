name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Build exe
        shell: cmd
        run: call build.bat

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ComicDownloader
          path: dist/ComicDownloader.exe
          if-no-files-found: error

      - name: Real-site smoke test
        shell: pwsh
        run: ./ci/smoke_test.ps1 -Exe dist/ComicDownloader.exe -WorkDir smoke

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke/*.log
          if-no-files-found: ignore

      - name: Create release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Comic Downloader v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: dist/ComicDownloader.exe
          body: |
            Windows build of Comic Downloader (commit ${{ github.sha }}).
            Download `ComicDownloader.exe` and run it; Chromium is downloaded next to the exe on first start.
